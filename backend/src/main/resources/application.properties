spring.application.name=covoitgo-api
server.port=8080
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/covoitgo_dev}
management.endpoints.web.exposure.include=health,info

# Configuration JWT
jwt.secret=${JWT_SECRET:covoitgoSecretKeyForJwtSigningMustBeAtLeast256BitsLong2026SuperSecure}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
